{% extends 'base.html' %}

{% block title %}
    Profile
{% endblock %}

{% block content %}
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
    <h2>My Profile</h2>
    <p>Username: {{ request.user.username }}</p>
    <p>Email: {{ request.user.email }}</p>
    <p>Phone: {{ request.user.phone }}</p>
{% endblock %}
