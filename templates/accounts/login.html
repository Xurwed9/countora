{% extends 'base.html' %}

{% block title %}
    Login
{% endblock %}

{% block content %}
<section>
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account?</p>
    <a href="{% url 'register' %}">Register</a>
</section>
{% endblock %}
