{% extends 'base.html' %}

{% block title %}
    Register
{% endblock %}

{% block content %}
<section>
    <h2>Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>
        Already have an account?
        <a href="#">Login</a>
    </p>
</section>
{% endblock %}
